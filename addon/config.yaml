# SmartVan.io Setup Add-on
name: "SmartVan.io"
version: "0.2.0"
slug: "smartvanio_setup"
description: >-
  One-click setup for SmartVan.io campervan control system.
  Installs the integration, dashboard cards, and configures MQTT.
url: "https://smartvan.io"

arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386

startup: application
boot: manual

# Needs config directory to install integration + cards + dashboards
map:
  - config:rw

options:
  mqtt_user: "smartvanio"
  mqtt_password: "smartvanio123"
  device_id: ""

schema:
  mqtt_user: str
  mqtt_password: password
  device_id: str

hassio_api: true
homeassistant_api: true

image: "ghcr.io/jameslouiz/smartvanio-addon-{arch}"
