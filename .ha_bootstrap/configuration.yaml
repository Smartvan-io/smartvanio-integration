# SmartVan.io Development Configuration

homeassistant:
  name: SmartVan.io Dev
  unit_system: metric
  currency: GBP
  time_zone: Europe/London
  internal_url: "http://192.168.0.16:8124"

# Enable default_config for standard HA functionality
default_config:

# Logger for debugging
logger:
  default: info
  logs:
    custom_components.smartvanio: debug

# Automations
automation: !include automations.yaml

# Scenes
scene: !include scenes.yaml

# Lovelace dashboards
lovelace:
  mode: yaml
  resources:
    - url: /local/kiosk-mode.js
      type: module
    - url: /local/smartvanio-main-card.js?v=141
      type: module
    - url: /local/smartvan-io-resistive-sensor.js?v=9
      type: module
    - url: /local/smartvan-io-inclinometer.js?v=6
      type: module
  dashboards:
    smartvan-io:
      mode: yaml
      title: SmartVan.io
      icon: mdi:van-utility
      show_in_sidebar: true
      filename: dashboards/smartvanio.yaml
