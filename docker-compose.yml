services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.4.1
    container_name: smartvanio-dev-ha
    restart: unless-stopped
    privileged: true
    ports:
      - "8124:8123"
    volumes:
      - ha_config:/config
      - ./.ha_bootstrap/configuration.yaml:/config/configuration.yaml
      - ./.ha_bootstrap/scenes.yaml:/config/scenes.bootstrap.yaml
      - ./.ha_bootstrap/automations.yaml:/config/automations.bootstrap.yaml
      - ./custom_components/smartvanio:/config/custom_components/smartvanio
      - ../smartvan.io-cards/main-card/index.js:/config/www/smartvanio-main-card.js:ro
      - ../smartvan.io-cards/main-card/kiosk-mode.js:/config/www/kiosk-mode.js:ro
      - ./.ha_bootstrap/dashboards:/config/dashboards:ro
      - ./.ha_bootstrap/ui-lovelace.yaml:/config/ui-lovelace.yaml:ro
    entrypoint: /bin/bash
    command: >
      -c "test -f /config/scenes.yaml || cp /config/scenes.bootstrap.yaml /config/scenes.yaml; test -f /config/automations.yaml || cp /config/automations.bootstrap.yaml /config/automations.yaml; exec /init"
    environment:
      - TZ=Europe/London
    depends_on:
      - mosquitto
    networks:
      - smartvanio-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartvanio-dev-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/passwords.txt:/mosquitto/config/passwords.txt
      - mosquitto_data:/mosquitto/data
    networks:
      - smartvanio-net

volumes:
  ha_config:
  mosquitto_data:

networks:
  smartvanio-net:
    driver: bridge
