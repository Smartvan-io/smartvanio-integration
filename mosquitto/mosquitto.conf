# Mosquitto MQTT Broker Configuration for SmartVan.io Development

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type all
connection_messages true

# Listener - standard MQTT
listener 1883
protocol mqtt

# Listener - WebSocket (for browser-based debugging tools)
listener 9001
protocol websockets

# Authentication
allow_anonymous false
password_file /mosquitto/config/passwords.txt
